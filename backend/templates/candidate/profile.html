{% extends 'base/dashboard_base.html' %}
{% load static %}

{% block title %}My Profile - JobBridge{% endblock %}

{% block content %}
<div class="page-header">
    <h1>My Profile</h1>
</div>

<div class="card">
    <form method="post" enctype="multipart/form-data" class="form">
        {% csrf_token %}
        <div class="form-row">
            <div class="form-group">
                <label for="first_name">First Name</label>
                <input type="text" id="first_name" name="first_name" value="{{ user.first_name }}">
            </div>
            <div class="form-group">
                <label for="last_name">Last Name</label>
                <input type="text" id="last_name" name="last_name" value="{{ user.last_name }}">
            </div>
        </div>
        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" value="{{ user.email }}" readonly>
        </div>
        <div class="form-group">
            <label for="headline">Headline</label>
            <input type="text" id="headline" name="headline" value="{{ profile.headline }}">
        </div>
        <div class="form-group">
            <label for="phone">Phone</label>
            <input type="tel" id="phone" name="phone" value="{{ profile.phone }}">
        </div>
        <div class="form-group">
            <label for="location">Location</label>
            <input type="text" id="location" name="location" value="{{ profile.location }}">
        </div>
        <div class="form-group">
            <label for="bio">Bio</label>
            <textarea id="bio" name="bio" rows="4">{{ profile.summary }}</textarea>
        </div>
        <div class="form-group">
            <label for="linkedin">LinkedIn</label>
            <input type="url" id="linkedin" name="linkedin" value="{{ profile.linkedin }}">
        </div>
        <div class="form-group">
            <label for="portfolio">Portfolio</label>
            <input type="url" id="portfolio" name="portfolio" value="{{ profile.portfolio }}">
        </div>
        <div class="form-group">
            <label for="profile_image">Profile Image</label>
            <input type="file" id="profile_image" name="profile_image" accept="image/*">
        </div>
        <button type="submit" class="btn btn-primary">Save Changes</button>
    </form>
</div>
{% endblock %}
