<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}JobBridge{% endblock %}</title>
    <style>
        body { margin: 0; padding: 0; font-family: Arial, sans-serif; background: #f4f5f7; color: #1f2937; }
        .email-wrapper { max-width: 600px; margin: 24px auto; background: #ffffff; border-radius: 8px; overflow: hidden; }
        .email-header { background: #2563eb; padding: 24px; text-align: center; }
        .email-header h1 { color: #ffffff; margin: 0; font-size: 22px; }
        .email-body { padding: 32px 24px; line-height: 1.6; }
        .email-body h2 { color: #111827; margin-top: 0; }
        .email-btn { display: inline-block; padding: 12px 24px; background: #2563eb; color: #ffffff !important; text-decoration: none; border-radius: 6px; font-weight: 600; margin: 16px 0; }
        .email-footer { background: #f9fafb; padding: 16px 24px; text-align: center; font-size: 12px; color: #6b7280; }
    </style>
</head>
<body>
    <div class="email-wrapper">
        <div class="email-header">
            <h1>JobBridge</h1>
        </div>
        <div class="email-body">
            {% block content %}{% endblock %}
        </div>
        <div class="email-footer">
            &copy; {% now "Y" %} JobBridge. All rights reserved.<br>
            <a href="{{ site_url }}" style="color: #2563eb;">Visit JobBridge</a>
        </div>
    </div>
</body>
</html>
