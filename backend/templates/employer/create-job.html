{% extends 'base/dashboard_base.html' %}
{% load static %}

{% block title %}Post a Job - JobBridge{% endblock %}

{% block content %}
<div class="page-header">
    <h1>Post a New Job</h1>
</div>

<div class="card">
    <form method="post" class="form">
        {% csrf_token %}
        <div class="form-group">
            <label for="title">Job Title</label>
            <input type="text" id="title" name="title" required>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label for="category">Category</label>
                <select id="category" name="category" required>
                    {% for cat in categories %}
                    <option value="{{ cat.id }}">{{ cat.name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label for="job_type">Job Type</label>
                <select id="job_type" name="job_type" required>
                    <option value="full_time">Full Time</option>
                    <option value="part_time">Part Time</option>
                    <option value="contract">Contract</option>
                    <option value="internship">Internship</option>
                    <option value="remote">Remote</option>
                </select>
            </div>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label for="location">Location</label>
                <input type="text" id="location" name="location" required>
            </div>
            <div class="form-group">
                <label for="salary_range">Salary Range</label>
                <input type="text" id="salary_range" name="salary_range" placeholder="e.g. $60k-$80k">
            </div>
        </div>
        <div class="form-group">
            <label for="description">Job Description</label>
            <textarea id="description" name="description" rows="6" required></textarea>
        </div>
        <div class="form-group">
            <label for="requirements">Requirements</label>
            <textarea id="requirements" name="requirements" rows="4"></textarea>
        </div>
        <div class="form-group">
            <label for="responsibilities">Responsibilities</label>
            <textarea id="responsibilities" name="responsibilities" rows="4"></textarea>
        </div>
        <button type="submit" class="btn btn-primary">Publish Job</button>
    </form>
</div>
{% endblock %}
