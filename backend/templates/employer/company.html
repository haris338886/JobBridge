{% extends 'base/dashboard_base.html' %}
{% load static %}

{% block title %}Company Profile - JobBridge{% endblock %}

{% block content %}
<div class="page-header">
    <h1>Company Profile</h1>
</div>

<div class="card">
    <form method="post" enctype="multipart/form-data" class="form">
        {% csrf_token %}
        <div class="form-group">
            <label for="name">Company Name</label>
            <input type="text" id="name" name="name" value="{{ company.name }}" required>
        </div>
        <div class="form-group">
            <label for="website">Website</label>
            <input type="url" id="website" name="website" value="{{ company.website }}">
        </div>
        <div class="form-group">
            <label for="industry">Industry</label>
            <input type="text" id="industry" name="industry" value="{{ company.industry }}">
        </div>
        <div class="form-group">
            <label for="size">Company Size</label>
            <select id="size" name="size">
                <option value="1-10">1-10</option>
                <option value="11-50">11-50</option>
                <option value="51-200">51-200</option>
                <option value="201-500">201-500</option>
                <option value="500+">500+</option>
            </select>
        </div>
        <div class="form-group">
            <label for="description">Company Description</label>
            <textarea id="description" name="description" rows="6">{{ company.description }}</textarea>
        </div>
        <div class="form-group">
            <label for="logo">Company Logo</label>
            {% if company.logo %}<p>Current: <img src="{{ company.logo.url }}" alt="{{ company.name }}" style="max-width: 120px;"></p>{% endif %}
            <input type="file" id="logo" name="logo" accept="image/*">
        </div>
        <button type="submit" class="btn btn-primary">Save Changes</button>
    </form>
</div>
{% endblock %}
